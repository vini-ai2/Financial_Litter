services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finlitter_test
      POSTGRES_USER: finlitter_test
      POSTGRES_PASSWORD: finlitter_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - finlitter_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlitter_test -d finlitter_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  finlitter_test_pgdata:
